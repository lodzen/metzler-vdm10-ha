answer_call:
  name: Answer call
  description: >-
    Answers the ringing VDM10 doorbell call (200 OK, audio established; the
    microphone stays muted until the camera's talk control is used).
  target:
    entity:
      integration: metzler_vdm10
      domain: button

hangup_call:
  name: Hang up call
  description: Declines the ringing call or hangs up the established call.
  target:
    entity:
      integration: metzler_vdm10
      domain: button

simulate_doorbell_press:
  name: Simulate doorbell press
  description: >-
    Fires the doorbell event as if the physical button was pressed - sends the
    Alexa DoorbellPress through the door camera endpoint. For testing the Alexa
    announcement/video chain without walking to the door.
