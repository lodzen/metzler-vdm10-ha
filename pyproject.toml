[project]
name = "vdm10-ha"
version = "0.1.0"
description = "Home Assistant custom integration for the Metzler/Hikvision VDM10 door intercom"
readme = "README.md"
authors = [
    { name = "lodzen", email = "dalodzik@googlemail.com" }
]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.14.2"
keywords = ["home-assistant", "integration", "intercom", "doorbell", "hikvision", "metzler", "vdm10"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
dependencies = [
    "vdm10-python",
]

[project.urls]
Repository = "https://github.com/lodzen/metzler-vdm10-ha"
Issues = "https://github.com/lodzen/metzler-vdm10-ha/issues"

[tool.uv]
package = false

# metzler resolves from PyPI (vdm10-python). For local development against an
# unpublished library checkout, re-enable:
# [tool.uv.sources]
# vdm10-python = { path = "../metzler-vdm10", editable = true }

[dependency-groups]
dev = [
    # pytest-homeassistant is the officially maintained core test package
    # (home-assistant/core/packages/pytest-homeassistant); it pins HA + pytest
    "homeassistant==2026.11.1",
    "pytest==9.0.3",
    "pytest-homeassistant==2026.11.1",
    "ruff>=0.17.3,<0.18",
    "ty>=0.0.107,<0.1",
    "pyturbojpeg>=2.6.1",
    # optional HA component dep (not pulled in by the homeassistant package);
    # our go2rtc module + tests import it
    "go2rtc-client",
]
# complexipy publishes no cp314 wheel; it is a pure syntax tool that does not
# import the codebase, so it runs standalone: uvx --python 3.13 complexipy
tools = ["complexipy>=4.2,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# load the HA harness before entrypoint plugins so its httpx2 alias installs
# before respx's plugin module imports httpx
addopts = "-p pytest_homeassistant"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line length is enforced by the formatter, not the linter
    "E701",   # deliberate compact style: one-line if/try bodies
    "E702",   # deliberate compact style: semicolon-separated statements
    "E731",   # deliberate compact style: lambdas assigned to names
    "SIM105", # try/except/pass one-liners preferred over contextlib.suppress
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components", "metzler"]

[tool.ty.src]
include = ["custom_components", "tests"]
# vendored library copy (built by tools/vendor.py) is not type-checked
exclude = ["custom_components/vdm10/vendor/metzler"]

[tool.ty.environment]
# .venv is auto-discovered by ty; the vendor dir lets `import metzler` resolve
# to the built vendored copy (excluded from checking itself, above)
root = [".", "./tests", "./custom_components/vdm10/vendor"]

[tool.ty.rules]
# HA entities declare writable _attr_* attributes that platforms override with
# read-only properties by design - the override check can't model that pattern
incompatible-property-override = "ignore"
