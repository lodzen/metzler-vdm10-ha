# CI: pytest on real Home Assistant, ruff lint + format check, ty type check.
# metzler resolves from PyPI as the `vdm10-python` package — the vendored copy
# under custom_components/vdm10/vendor is what ty checks against.
name: CI
permissions:
  contents: read

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up uv + Python
      # pytest-homeassistant requires >=3.14.2; HA 2026.11 runs on it.
      uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: "3.14"
        enable-cache: true
    - name: Install dependencies
      run: uv sync
    - name: Test with pytest
      run: uv run pytest

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up uv + Python
      uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: "3.14"
        enable-cache: true
    - name: Install dependencies and tools
      run: uv sync
    - name: Ruff lint
      run: uv run ruff check .
    - name: Ruff format check
      run: uv run ruff format --check .
    - name: Type check with ty
      run: uv run ty check
